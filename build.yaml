# Matriz de build do GitHub Actions (ZMK v0.3).
# O SuperMini nRF52840 usa o mesmo alvo do nice!nano v2.
# O lado esquerdo é o central (conecta ao computador) e roda o ZMK Studio.
---
include:
  - board: nice_nano_v2
    shield: teclado_do_fogo_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: nice_nano_v2
    shield: teclado_do_fogo_right
  - board: nice_nano_v2
    shield: settings_reset
